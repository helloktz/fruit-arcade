<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 80">
  <title>Blue orchard plum</title>
  <style>
  :root {
    --ink: #152a50;
    --skin: #284d95;
    --shade: #212d67;
    --bloom: #5791ce;
    --core: #3f78bf;
    --shine: #dfedf9;
    --stem: #775734;
    --leaf: #6b9956;
  }
  </style>
  <defs>
    <radialGradient id="plum-colour" cx="44%" cy="41%" r="67%">
      <stop offset="0%" style="stop-color:var(--core)"/>
      <stop offset="55%" style="stop-color:var(--skin)"/>
      <stop offset="100%" style="stop-color:var(--shade)"/>
    </radialGradient>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M48 22c9-6 19-7 29-2 14 8 15 28 3 42-14 16-43 17-59 5C6 57 5 41 14 29c8-12 25-15 34-7Z" fill="url(#plum-colour)" stroke-width="2.6" style="stroke:var(--ink)"/>
    <path d="M15 36c6-10 20-17 30-11-5 1-20 6-27 18-4 7-8 1-3-7Z" style="fill:var(--bloom)"/>
    <path d="M22 61c12 9 31 10 47 0 10-6 15-17 15-24 7 11 4 16-4 25-15 16-43 17-59 5Z" style="fill:var(--shade)"/>
    <path d="M17 42q5-11 18-14" stroke-width="4" style="fill:none;stroke:var(--shine)"/>
    <path d="M50 24c9 6 12 16 10 27" stroke-width="2.2" style="fill:none;stroke:var(--shade)"/>
    <path d="M55 28q4 4 5 10" stroke-width="1.7" style="fill:none;stroke:var(--bloom)"/>
    <path d="M71 21q2-8 8-11l3 2q-4 4-6 11Z" stroke-width="2.4" style="fill:var(--stem);stroke:var(--ink)"/>
    <path d="M78 17q7-9 16-5-4 7-16 5Z" stroke-width="2" style="fill:var(--leaf);stroke:var(--ink)"/>
  </g>
