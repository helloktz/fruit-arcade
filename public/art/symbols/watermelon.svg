<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 80">
  <title>Paired orchard watermelon</title>
  <style>
    :root {
      --outline: #163837;
      --rind: #275e58;
      --rind-shadow: #1d4446;
      --stripe: #14363a;
      --rind-light: #3d8380;
      --rind-glint: #76b8ad;
      --pith: #cfdfcf;
      --flesh: #bd4050;
      --flesh-shadow: #7f263e;
      --flesh-glint: #d3656b;
    }
  </style>
  <defs>
    <radialGradient id="cut-colour" cx="40%" cy="48%" r="66%">
      <stop offset="15%" style="stop-color:var(--flesh)"/>
      <stop offset="100%" style="stop-color:var(--flesh-shadow)"/>
    </radialGradient>
    <path id="rind" d="M37 18C24 13 12 19 6 28C1 35 1 45 6 52C12 61 24 67 37 62C45 60 46 51 46 40C46 29 45 20 37 18Z"/>
    <clipPath id="rind-clip"><use href="#rind"/></clipPath>
    <!-- Two tapered bands and their reflection about y=40 form the stripe set. -->
    <radialGradient id="rind-light" cx="63%" cy="47%" r="59%">
      <stop offset="5%" style="stop-color:var(--rind-glint)"/>
      <stop offset="52%" style="stop-color:var(--rind-light)" stop-opacity=".9"/>
      <stop offset="100%" style="stop-color:var(--rind-light)" stop-opacity="0"/>
    </radialGradient>
    <path id="upper-stripes" transform="matrix(1 .42 0 1 0 -6.5)" d="
      M9.6 28.5Q10 26.4 11.9 24.9L13.2 25.1 14.2 23.1 15.7 23.3
      Q16.6 22.2 17.4 21.9L19.5 22.5 21.6 22 23.4 22.7 25.5 21.9Q29 22.1 31.7 24.2
      L28.4 24.9 26.6 24.4 24.9 25.1 23.3 24.8 21.5 24.5 20 25.7 18.4 24.9 16.7 26.1 15.2 25.8
      13.5 27.4 12.3 27.1Q11 28.5 9.6 28.5Z
      M7.9 37.5Q8.5 35 10.4 33.9L11.8 34.1 13.2 31.8 14.8 32.2
      17 30.6 18.6 31 20.3 29.8 22 31 23.6 30.4Q26.6 30.7 29.2 32.4
      L27.8 33.3 25.9 32.9 24.1 33.6 22.1 33 20.5 34.2 18.7 33.4 17.3 34.6 15.8 34.1
      14 35.6 12.4 35.2 11.1 36.7 9.7 36.4Q8.9 37.6 7.9 37.5Z"/>
    <g id="half" stroke-linejoin="round" stroke-linecap="round">
      <g transform="translate(0 40) scale(1 1.16) translate(0 -40)">
        <use href="#rind" style="fill:var(--rind);stroke:var(--outline)" stroke-width="2.2"/>
        <g clip-path="url(#rind-clip)">
          <path d="M0 44Q16 62 32 55L38 66H0Z" style="fill:var(--rind-shadow)"/>
          <path d="M3 28Q14 19 34 26V54Q13 61 3 52Z" fill="url(#rind-light)"/>
          <g style="fill:var(--stripe)">
            <use href="#upper-stripes"/>
            <use href="#upper-stripes" transform="translate(0 80) scale(1 -1)"/>
          </g>
        </g>
      </g>
      <ellipse cx="36.5" cy="40" rx="9.6" ry="21"
               style="fill:var(--pith);stroke:var(--outline)" stroke-width="2.15"/>
      <ellipse cx="36.5" cy="40" rx="7.2" ry="15.5" fill="url(#cut-colour)"/>
      <path d="M34.4 33Q32.8 35.5 32.9 38.6" fill="none"
            style="stroke:var(--flesh-glint)" stroke-width="1.2"/>
    </g>
  </defs>
  <!-- Back half first. The only difference between the instances is x=39. -->
  <use href="#half" x="43" y="1.4"/>
  <use href="#half" x="4" y="1.4"/>
</svg>
