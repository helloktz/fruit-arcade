<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 80">
  <title>Cluster of three cherries</title>
  <style>
  :root {
    --ink: #522739;
    --skin: #e03a42;
    --shade: #a51d39;
    --shine: #ffd6a4;
    --leaf: #75a954;
    --leaf-shine: #bcce65;
    --stem: #395e41;
  }
  </style>
  <g stroke-linejoin="round" stroke-linecap="round">
    <defs>
      <g id="cherry">
        <path d="M2-14c8-3 16 2 16 13 0 10-6 18-16 19-9 1-18-7-17-17 0-8 6-13 17-15Z" stroke-width="2.6" style="fill:var(--skin);stroke:var(--ink)"/>
        <path d="M-13 7c5 7 15 9 22 2 3-3 5-6 7-10 1 9-4 17-14 19-7 2-14-3-15-11Z" style="fill:var(--shade)"/>
        <path d="M-9-2q1-5 6-6" stroke-width="3.6" style="fill:none;stroke:var(--shine)"/>
        <ellipse cx="0" cy="-10" rx="3" ry="1.3" style="fill:var(--shade)"/>
      </g>
    </defs>
    <path d="M46 12C43 27 29 34 23 47m23-34c8 15 5 28 5 37m-4-38c20 5 23 16 30 28" stroke-width="3.5" style="fill:none;stroke:var(--stem)"/>
    <use href="#cherry" transform="translate(75 45) rotate(-19) scale(.98)"/>
    <use href="#cherry" transform="translate(24 51) rotate(10) scale(1.02)"/>
    <use href="#cherry" transform="translate(51 56) rotate(7) scale(1.12)"/>
    <path d="M49 13C30 8 16 15 12 37c5 1 18-5 24-11 6-4 8-9 13-13Zm0-2c10-7 25-8 37 0-7 8-22 11-37 0Z" stroke-width="2.3" style="fill:var(--leaf);stroke:var(--stem)"/>
    <path d="M18 30q8-13 24-15m14-2q12 3 23-1" stroke-width="2.1" style="fill:none;stroke:var(--leaf-shine)"/>
  </g>
</svg>
